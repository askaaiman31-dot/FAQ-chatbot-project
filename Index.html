<!DOCTYPE html>
<html><body style="background:#0f172a;color:white;text-align:center;padding:30px;font-family:Arial">
<h2>College FAQ Chatbot 🤖</h2>
<div id="chat" style="background:#1e293b;padding:15px;border-radius:10px;max-width:400px;margin:auto;text-align:left"></div>
<input id="q" placeholder="Ask about fees, coa, cache" style="padding:10px;width:60%;margin-top:10px;border-radius:8px">
<button onclick="ask()" style="padding:10px;border-radius:8px;background:#22c55e">Send</button>
<script>
const db={"coa":"COA is Computer Organization & Architecture","cache":"Cache is fast memory between CPU & RAM","fees":"Fees 75,000 per year","admission":"Admission 9AM to 4PM at admin block"};
function ask(){let v=document.getElementById("q").value.toLowerCase();let a="Sorry, contact admin";for(let k in db){if(v.includes(k)){a=db[k]}}document.getElementById("chat").innerHTML+="<p><b>You:</b>"+v+"</p><p><b>Bot:</b>"+a+"</p>";document.getElementById("q").value=""}
</script>
</body></html>
